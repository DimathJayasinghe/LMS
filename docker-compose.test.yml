# TEST override — a throwaway, isolated local Postgres (separate from the prod `pgdata`) so the (destructive)
# new schema can be applied and smoke-tested WITHOUT touching the real database.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
# NODE_ENV=development so the app boots without external service creds (R2/Bunny/…).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - lms
    restart: unless-stopped

  backend:
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://lms:lms@postgres:5432/lms?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://lms:lms@postgres:5432/lms?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
