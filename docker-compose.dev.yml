services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    image: lms-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      REDIS_URL: redis://redis:6379
      CHOKIDAR_USEPOLLING: "1"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - redis
    command: sh ./scripts/docker-dev.sh
    restart: unless-stopped

  worker:
    image: lms-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      CHOKIDAR_USEPOLLING: "1"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - redis
    command: npm run dev:worker
    restart: unless-stopped
