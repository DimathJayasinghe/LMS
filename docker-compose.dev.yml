# Local DEV stack. Same self-hosted Postgres as prod, but the DB port is published
# on 5433 so host tools (psql, Prisma Studio, migrations) can reach it directly.
# Start:  docker compose -f docker-compose.dev.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ./backend/.env
    ports:
      # Host-mapped for dev tooling only (prod publishes NO db port).
      - "5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    image: lms-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      REDIS_URL: redis://redis:6379
      CHOKIDAR_USEPOLLING: "1"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh ./scripts/docker-dev.sh
    restart: unless-stopped

  worker:
    image: lms-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      CHOKIDAR_USEPOLLING: "1"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "npx prisma generate && npx tsx src/worker.ts"
    restart: unless-stopped

volumes:
  pgdata-dev:
