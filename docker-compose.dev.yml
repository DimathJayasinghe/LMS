services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    image: lms-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      REDIS_URL: redis://redis:6379
      CHOKIDAR_USEPOLLING: "1"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - redis
    command: sh ./scripts/docker-dev.sh
    restart: unless-stopped
