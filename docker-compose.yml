version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lms
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"
    networks:
      - lms
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost
    depends_on:
      - redis
    expose:
      - "5000"
    networks:
      - lms
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - lms
    restart: unless-stopped

networks:
  lms:
    driver: bridge
