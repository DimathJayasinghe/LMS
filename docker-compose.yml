# Here this exposes 5000 to the host machine

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - lms
    restart: unless-stopped

  backend:
    image: lms-backend-prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost
    depends_on:
      - redis
    expose:
      - "5000"
    networks:
      - lms
    restart: unless-stopped

  worker:
    image: lms-backend-prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["npm", "run", "worker"]
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    networks:
      - lms
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - lms
    restart: unless-stopped

networks:
  lms:
    driver: bridge
