# nginx for the API VPS (api.academylms.com).
# The frontend is hosted on Vercel — this box only reverse-proxies /api to the
# backend container and terminates TLS. SSE endpoints need buffering off and a
# long read timeout (see /api/stream).

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS — lets us resolve the "backend" service name and
  # tolerate the container's IP changing across redeploys.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:5000 resolve;
  }

  # Real client IP: the app binds video/stream tokens to req.ip, so the true
  # client address must survive the proxy hops (Cloudflare → nginx → API).
  # Express must run with `app.set('trust proxy', true)`.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Uploads go direct-to-R2 via presigned URLs, so the API never receives large
  # bodies. Keep this modest; bump only if a JSON endpoint legitimately needs it.
  client_max_body_size 10m;

  server {
    listen 80;
    server_name _;

    # Hide nginx version; basic hardening headers.
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # Liveness for the container healthcheck / load balancers.
    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # SSE: keep the connection open, don't buffer server-pushed events.
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 3600s;

      proxy_pass http://backend_upstream;
    }

    # This box serves the API only. Everything else 404s (frontend is on Vercel).
    location / {
      return 404;
    }
  }

  # ── TLS (enable after mounting certs; see docker-compose 443 + certs volume) ──
  # server {
  #   listen 443 ssl http2;
  #   server_name api.academylms.com;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   # ... same location blocks as above ...
  # }
  #
  # server {                      # redirect http → https
  #   listen 80;
  #   server_name api.academylms.com;
  #   return 301 https://$host$request_uri;
  # }
}
